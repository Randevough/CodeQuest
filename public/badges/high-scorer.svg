<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-high-scorer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Badge Background -->
  <circle cx="100" cy="100" r="90" fill="url(#grad-high-scorer)" filter="url(#shadow)" stroke="white" stroke-width="4"/>
  
  <!-- Inner Circle for Icon -->
  <circle cx="100" cy="100" r="50" fill="#10b981"/>
  
  <!-- Icon -->
  <g transform="translate(68, 68) scale(2.5)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" /> <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2" /> <circle cx="12" cy="12" r="2" fill="currentColor" />
    </svg>
  </g>
</svg>