name: Deploy Staging

on:
  push:
    branches: [master, redesign/dark-playful-arcade]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: codequest_staging
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/codequest_staging"
      DIRECT_URL: "postgresql://postgres:password@127.0.0.1:5432/codequest_staging"
      AUTH_SECRET: ci-mock-auth-secret-minimum-32-characters-length
      UPSTASH_REDIS_REST_URL: https://mock-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: mock-upstash-token
      EMAIL_MODE: mock

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run unit & integration tests
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/codequest_staging"
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma db push --skip-generate

      - name: Build Next.js application
        run: npm run build
